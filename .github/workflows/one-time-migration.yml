name: One-time data science portfolio migration

on:
  push:
    branches:
      - migration/data-science-projects

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Migrate whitelisted project files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/data-science-migration"
          SOURCES="$ROOT/sources"
          DEST="$ROOT/destination"
          mkdir -p "$SOURCES"

          git clone --quiet --branch migration/data-science-projects \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DEST"

          migrate_repo() {
            local repo="$1"
            local branch="$2"
            local target="$3"
            local src="$SOURCES/$repo"
            local dst="$DEST/$target"

            echo "Migrating $repo ($branch) -> $target"
            git clone --quiet --depth 1 --branch "$branch" \
              "https://github.com/DavidAlmagro/${repo}.git" "$src"

            # Defensive scan. Repository content is never executed.
            local suspicious
            suspicious=$(find "$src" \
              -path "$src/.git" -prune -o \
              \( -name 'package.json' -o -name 'package-lock.json' -o -name 'yarn.lock' -o -name 'pnpm-lock.yaml' \
                 -o -path '*/.github/workflows/*' -o -path '*/.vscode/*' -o -path '*/.claude/*' \
                 -o -name '.env' -o -name '.env.*' -o -name '*.sh' \) -print || true)
            if [[ -n "$suspicious" ]]; then
              echo "Security review required for $repo. Suspicious files found:"
              echo "$suspicious"
              exit 20
            fi

            mkdir -p "$dst"

            python3 - "$src" "$dst" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])

          data_ext = {'.csv', '.tsv', '.data', '.names', '.xlsx', '.xls', '.parquet'}
          image_ext = {'.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp'}
          code_ext = {'.py'}
          ignored = {'.DS_Store', '.gitignore', 'LICENSE.save'}

          notebooks = []
          for item in src.iterdir():
              if item.name == '.git' or item.name.startswith('.ipynb_checkpoints'):
                  continue
              if item.is_dir():
                  # Do not copy hidden/configuration or unreviewed nested directories.
                  continue
              if item.name in ignored or item.name.lower().startswith('readme'):
                  continue
              if item.suffix == '.ipynb':
                  notebooks.append(item)
                  continue
              if item.name.upper().startswith('LICENSE'):
                  shutil.copy2(item, dst / item.name)
              elif item.suffix.lower() in data_ext:
                  out = dst / 'data'
                  out.mkdir(exist_ok=True)
                  shutil.copy2(item, out / item.name)
              elif item.suffix.lower() in image_ext:
                  out = dst / 'assets'
                  out.mkdir(exist_ok=True)
                  shutil.copy2(item, out / item.name)
              elif item.suffix.lower() in code_ext:
                  out = dst / 'src'
                  out.mkdir(exist_ok=True)
                  shutil.copy2(item, out / item.name)
              else:
                  out = dst / 'supporting-files'
                  out.mkdir(exist_ok=True)
                  shutil.copy2(item, out / item.name)

          if len(notebooks) != 1:
              raise SystemExit(f'Expected exactly one top-level notebook in {src.name}; found {len(notebooks)}')
          shutil.copy2(notebooks[0], dst / 'analysis.ipynb')
          PY
          }

          migrate_repo ParticleClassification_PCA main 04-unsupervised-learning/particle-classification-pca
          migrate_repo BookRecommender_SVM_Prototype main 03-supervised-learning/book-recommender-svm
          migrate_repo BiodiversityInNationalParks_USA main 01-data-analysis/biodiversity-national-parks
          migrate_repo PredictingHeartFailure_DeepLearning main 05-neural-networks/heart-failure-deep-learning
          migrate_repo WineQuality_Regularization main 03-supervised-learning/wine-quality-regularization
          migrate_repo FeatureEngineering_WrapperMethods master 02-feature-engineering/wrapper-feature-selection
          migrate_repo HandwritingRecognition_KMeans main 04-unsupervised-learning/handwriting-recognition-kmeans
          migrate_repo LogicGates_Perceptron main 05-neural-networks/logic-gates-perceptron
          migrate_repo BaseballStrikeZones_SVM main 03-supervised-learning/baseball-strike-zones-svm
          migrate_repo NeuralNetworks_PerceptronClass main 05-neural-networks/perceptron-from-scratch
          migrate_repo DiagnosingDiabetes_EDA master 01-data-analysis/diagnosing-diabetes
          migrate_repo 20240907_Life-Expectancy-and-GDP-Starter master 01-data-analysis/life-expectancy-gdp
          migrate_repo OlivettiFaces_PCA main 04-unsupervised-learning/olivetti-faces-pca
          migrate_repo CarAcceptability_GradientBoosting main 03-supervised-learning/car-acceptability-gradient-boosting
          migrate_repo IncomePrediction_RandomForest main 03-supervised-learning/income-prediction-random-forest
          migrate_repo NBA_Trends_DataVisualization master 01-data-analysis/nba-trends
          migrate_repo RaisinClassification_HyperparameterTuning master 03-supervised-learning/raisin-classification
          migrate_repo EmailSimilarity_NaiveBayes main 03-supervised-learning/email-similarity-naive-bayes

          cd "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01-data-analysis 02-feature-engineering 03-supervised-learning 04-unsupervised-learning 05-neural-networks

          if git diff --cached --quiet; then
            echo "No migration changes detected."
            exit 0
          fi

          git commit -m "Migrate data science project sources [skip ci]"
          git push origin migration/data-science-projects
