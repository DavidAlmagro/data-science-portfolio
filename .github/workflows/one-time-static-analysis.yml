name: One-time static notebook analysis

on:
  push:
    branches:
      - migration/data-science-projects

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Extract notebook metadata and saved outputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/notebook-static-analysis"
          git clone --quiet --branch migration/data-science-projects \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$ROOT"
          cd "$ROOT"
          mkdir -p .migration

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          notebooks = sorted(root.glob('[0-9][0-9]-*/**/analysis.ipynb'))
          lines = [
              '# Temporary Notebook Static Analysis',
              '',
              'Generated without executing notebook code. Only stored source text and saved outputs are inspected.',
              ''
          ]

          metric_terms = re.compile(r'(accuracy|score|precision|recall|f1|r2|r\^2|mse|mae|rmse|variance|component|cluster|correlation|p-value|mean|median|prediction|coefficient)', re.I)
          conclusion_terms = re.compile(r'(conclusion|finding|result|summary|takeaway|insight|observ)', re.I)

          for nb_path in notebooks:
              nb = json.loads(nb_path.read_text(encoding='utf-8'))
              lines += [f'## {nb_path.parent.as_posix()}', '']

              imports = []
              headings = []
              candidate_markdown = []
              outputs = []
              metric_code = []

              for cell in nb.get('cells', []):
                  source = ''.join(cell.get('source', []))
                  if cell.get('cell_type') == 'markdown':
                      for s in source.splitlines():
                          if s.lstrip().startswith('#'):
                              headings.append(s.strip())
                      if conclusion_terms.search(source):
                          text = ' '.join(source.split())
                          candidate_markdown.append(text[:1200])
                  elif cell.get('cell_type') == 'code':
                      for s in source.splitlines():
                          st = s.strip()
                          if st.startswith('import ') or st.startswith('from '):
                              imports.append(st)
                          if metric_terms.search(st) and not st.startswith('#'):
                              metric_code.append(st[:300])

                      for out in cell.get('outputs', []):
                          text = ''
                          if out.get('output_type') == 'stream':
                              val = out.get('text', '')
                              text = ''.join(val) if isinstance(val, list) else str(val)
                          elif out.get('output_type') in {'execute_result', 'display_data'}:
                              val = out.get('data', {}).get('text/plain', '')
                              text = ''.join(val) if isinstance(val, list) else str(val)
                          text = text.strip()
                          if text and (metric_terms.search(text) or len(text) < 500):
                              outputs.append(text[:1000])

              def unique(items, limit):
                  seen = set()
                  out = []
                  for item in items:
                      if item not in seen:
                          seen.add(item)
                          out.append(item)
                      if len(out) >= limit:
                          break
                  return out

              lines.append('### Imports')
              for x in unique(imports, 30):
                  lines.append(f'- `{x}`')
              if not imports:
                  lines.append('- None found')
              lines.append('')

              lines.append('### Headings')
              for x in unique(headings, 30):
                  lines.append(f'- {x}')
              lines.append('')

              lines.append('### Result-oriented markdown')
              for x in unique(candidate_markdown, 12):
                  lines.append(f'- {x}')
              if not candidate_markdown:
                  lines.append('- None found')
              lines.append('')

              lines.append('### Metric/result code')
              for x in unique(metric_code, 25):
                  lines.append(f'- `{x}`')
              if not metric_code:
                  lines.append('- None found')
              lines.append('')

              lines.append('### Saved textual outputs')
              for x in unique(outputs, 25):
                  clean = ' '.join(x.split())
                  lines.append(f'- {clean}')
              if not outputs:
                  lines.append('- None found')
              lines += ['', '---', '']

          Path('.migration/NOTEBOOK_SUMMARIES.md').write_text('\n'.join(lines), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .migration/NOTEBOOK_SUMMARIES.md
          git commit -m "Add temporary notebook analysis summary [skip ci]"
          git push origin migration/data-science-projects
