name: One-time normalize notebook data paths

on:
  push:
    branches:
      - migration/data-science-projects

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite local dataset paths without executing notebooks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/notebook-path-normalization"
          git clone --quiet --branch migration/data-science-projects \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$ROOT"
          cd "$ROOT"

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          changed_notebooks = []
          for nb_path in sorted(Path('.').glob('[0-9][0-9]-*/**/analysis.ipynb')):
              data_dir = nb_path.parent / 'data'
              if not data_dir.exists():
                  continue
              data_files = [p.name for p in data_dir.iterdir() if p.is_file()]
              if not data_files:
                  continue

              nb = json.loads(nb_path.read_text(encoding='utf-8'))
              changed = False

              for cell in nb.get('cells', []):
                  if cell.get('cell_type') != 'code':
                      continue
                  source = cell.get('source', [])
                  new_source = []
                  for line in source:
                      new_line = line
                      # Do not rewrite remote URLs; only local file references.
                      if 'http://' not in line and 'https://' not in line:
                          for filename in data_files:
                              pattern = re.compile(r"(['\"])(?:[^'\"]*/)?" + re.escape(filename) + r"\1")
                              new_line = pattern.sub(lambda m, fn=filename: f"{m.group(1)}data/{fn}{m.group(1)}", new_line)
                      if new_line != line:
                          changed = True
                      new_source.append(new_line)
                  cell['source'] = new_source

              if changed:
                  nb_path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
                  changed_notebooks.append(str(nb_path))

          print('Updated notebook paths:')
          for path in changed_notebooks:
              print(f'- {path}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '01-data-analysis/**/analysis.ipynb' '02-feature-engineering/**/analysis.ipynb' '03-supervised-learning/**/analysis.ipynb' '04-unsupervised-learning/**/analysis.ipynb' '05-neural-networks/**/analysis.ipynb' || true
          if git diff --cached --quiet; then
            echo "No notebook paths required changes."
            exit 0
          fi
          git commit -m "Normalize migrated notebook data paths [skip ci]"
          git push origin migration/data-science-projects
